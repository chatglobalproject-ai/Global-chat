<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1420">
  <title>Global Chat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: #0f1420;
      color: #e6e9ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }

    header {
      padding: 14px 16px;
      background: #161c2b;
      border-bottom: 1px solid #232b3d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: linear-gradient(90deg, #6ee7ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .online {
      font-size: 12px;
      color: #6ee7ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    header .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 0; }

    .msg {
      max-width: 82%;
      display: flex;
      flex-direction: column;
      gap: 3px;
      animation: pop 0.18s ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.other { align-self: flex-start; align-items: flex-start; }
    .msg.mine { align-self: flex-end; align-items: flex-end; }

    .name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 0 4px;
      text-transform: uppercase;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .msg.other .bubble {
      background: #1d2537;
      border: 1px solid #2a3348;
      border-top-left-radius: 5px;
      color: #e6e9ef;
    }
    .msg.mine .bubble {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-top-right-radius: 5px;
      color: #ffffff;
    }
    .time {
      font-size: 10px;
      color: #5b6478;
      padding: 0 4px;
    }

    #sendbar {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: #161c2b;
      border-top: 1px solid #232b3d;
    }
    #input {
      flex: 1;
      background: #0f1420;
      border: 1px solid #2a3348;
      border-radius: 22px;
      padding: 11px 16px;
      color: #e6e9ef;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    #input:focus { border-color: #3b82f6; }
    #input::placeholder { color: #5b6478; }
    #send {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    #send:active { transform: scale(0.92); }
  </style>
</head>
<body>
  <header>
    <h1>GLOBAL CHAT</h1>
    <div class="online"><span class="dot"></span><span id="onlineCount">1 online</span></div>
  </header>

  <div id="messages"></div>

  <div id="sendbar">
    <input id="input" type="text" placeholder="Say something to the world..." maxlength="280" autocomplete="off">
    <button id="send" aria-label="Send">➤</button>
  </div>

  <script>
    // ---- Fake data for Day 2 (replaced with Firebase on Day 3) ----
    const COLORS = ['#6ee7ff','#a78bfa','#f472b6','#facc15','#34d399','#fb923c','#60a5fa'];
    function colorFor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return COLORS[Math.abs(hash) % COLORS.length];
    }
    function timeNow() {
      const d = new Date();
      return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // Fake identity for now
    const MY_NAME = 'You';

    const seed = [
      { name: 'Nova',   text: 'hey everyone, first time here 👋' },
      { name: 'Kai',    text: 'welcome! this place is wild' },
      { name: 'Nova',   text: 'what country are you all from?' },
      { name: 'Zephyr', text: 'brazil 🇧🇷' },
      { name: 'Kai',    text: 'japan 🇯🇵' },
    ];

    function addMessage(name, text, isMine, time) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + (isMine ? 'mine' : 'other');

      if (!isMine) {
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = name;
        nameEl.style.color = colorFor(name);
        wrap.appendChild(nameEl);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);

      const timeEl = document.createElement('div');
      timeEl.className = 'time';
      timeEl.textContent = time || timeNow();
      wrap.appendChild(timeEl);

      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Load seed messages
    seed.forEach((m, i) => addMessage(m.name, m.text, false, '00:0' + i));

    // Send handler
    function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(MY_NAME, text, true);
      inputEl.value = '';
      inputEl.focus();
      // Day 3: push to Firebase here
    }
    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
